limit_req_zone $binary_remote_addr zone=linq_demo_predict:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=linq_demo_webcam:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=linq_demo_tpu:10m rate=12r/s;
server {
    listen 80;
    listen [::]:80;
    server_name linq.user-link.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/linq-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://linq.user-link.xyz$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linq.user-link.xyz;
    ssl_certificate /etc/letsencrypt/live/linq.user-link.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linq.user-link.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 15m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log /var/log/nginx/linq-demo.access.log;
    error_log /var/log/nginx/linq-demo.error.log;
    location = /api/demo/predict {
        limit_req zone=linq_demo_predict burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/linq-demo-proxy.conf;
        proxy_pass http://127.0.0.1:18090;
    }
    location = /api/demo/webcam {
        client_max_body_size 4m;
        limit_req zone=linq_demo_webcam burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/linq-demo-proxy.conf;
        proxy_pass http://127.0.0.1:18090;
    }
    location = /api/demo/linq-health {
        include /etc/nginx/snippets/linq-demo-proxy.conf;
        proxy_pass http://127.0.0.1:18094;
    }
    location = /api/demo/webcam/linq {
        client_max_body_size 4m;
        limit_req zone=linq_demo_tpu burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/linq-demo-proxy.conf;
        proxy_pass http://127.0.0.1:18094;
    }
    location / {
        include /etc/nginx/snippets/linq-demo-proxy.conf;
        proxy_pass http://127.0.0.1:18090;
    }
}
